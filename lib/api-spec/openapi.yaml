openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Realona Exchange API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: listings
  - name: trades
  - name: chat
  - name: deposits
  - name: withdrawals
  - name: reports
  - name: admin
  - name: webhooks

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── AUTH ──────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── USERS ─────────────────────────────────────────────────────────────────
  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"

  /users/wallet/balance:
    get:
      operationId: getWalletBalance
      tags: [users]
      summary: Get current user wallet balance
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletBalance"

  /users/virtual-account:
    get:
      operationId: getVirtualAccount
      tags: [users]
      summary: Get or create virtual account for deposits
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualAccount"

  # ─── LISTINGS ──────────────────────────────────────────────────────────────
  /listings:
    get:
      operationId: getListings
      tags: [listings]
      summary: Get all active listings
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: game
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"
    post:
      operationId: createListing
      tags: [listings]
      summary: Create a new listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"

  /listings/my:
    get:
      operationId: getMyListings
      tags: [listings]
      summary: Get current user listings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"

  /listings/{id}:
    get:
      operationId: getListing
      tags: [listings]
      summary: Get a listing by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
    patch:
      operationId: updateListing
      tags: [listings]
      summary: Update a listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
    delete:
      operationId: deleteListing
      tags: [listings]
      summary: Delete a listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ─── TRADES ────────────────────────────────────────────────────────────────
  /trades:
    get:
      operationId: getTrades
      tags: [trades]
      summary: Get current user trades (as buyer or seller)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"
    post:
      operationId: createTrade
      tags: [trades]
      summary: Initiate a trade (buy a listing)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"

  /trades/{id}:
    get:
      operationId: getTrade
      tags: [trades]
      summary: Get trade details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"

  /trades/{id}/confirm-payment:
    post:
      operationId: confirmTradePayment
      tags: [trades]
      summary: Buyer confirms payment (escrow funded)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"

  /trades/{id}/seller-transferred:
    post:
      operationId: sellerTransferred
      tags: [trades]
      summary: Seller marks account as transferred
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"

  /trades/{id}/confirm-receipt:
    post:
      operationId: confirmReceipt
      tags: [trades]
      summary: Buyer confirms receipt - releases funds to seller
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"

  /trades/{id}/dispute:
    post:
      operationId: openDispute
      tags: [trades]
      summary: Open a dispute on a trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisputeInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"

  # ─── CHAT ──────────────────────────────────────────────────────────────────
  /trades/{id}/messages:
    get:
      operationId: getTradeMessages
      tags: [chat]
      summary: Get messages for a trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TradeMessage"
    post:
      operationId: sendTradeMessage
      tags: [chat]
      summary: Send a message in a trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeMessage"

  # ─── DEPOSITS ──────────────────────────────────────────────────────────────
  /deposits:
    get:
      operationId: getDeposits
      tags: [deposits]
      summary: Get deposit history for current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deposit"

  # ─── WITHDRAWALS ───────────────────────────────────────────────────────────
  /withdrawals:
    get:
      operationId: getWithdrawals
      tags: [withdrawals]
      summary: Get withdrawal history for current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Withdrawal"
    post:
      operationId: requestWithdrawal
      tags: [withdrawals]
      summary: Request a withdrawal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"

  # ─── REPORTS ───────────────────────────────────────────────────────────────
  /reports:
    post:
      operationId: createReport
      tags: [reports]
      summary: Submit a scam report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  # ─── ADMIN ─────────────────────────────────────────────────────────────────
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get platform overview stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: Get all users
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: suspended
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"

  /admin/users/{id}/suspend:
    post:
      operationId: suspendUser
      tags: [admin]
      summary: Suspend or unsuspend a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /admin/users/{id}/adjust-balance:
    post:
      operationId: adjustUserBalance
      tags: [admin]
      summary: Admin adjusts a user wallet balance (refund, penalty)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BalanceAdjustInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /admin/trades:
    get:
      operationId: getAdminTrades
      tags: [admin]
      summary: Get all trades
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"

  /admin/trades/{id}/force-complete:
    post:
      operationId: forceCompleteTrade
      tags: [admin]
      summary: Admin force completes a trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"

  /admin/trades/{id}/refund-buyer:
    post:
      operationId: refundBuyer
      tags: [admin]
      summary: Admin refunds buyer (cancel trade, return escrow)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"

  /admin/withdrawals:
    get:
      operationId: getAdminWithdrawals
      tags: [admin]
      summary: Get all withdrawal requests
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Withdrawal"

  /admin/withdrawals/{id}/approve:
    post:
      operationId: approveWithdrawal
      tags: [admin]
      summary: Approve a withdrawal request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"

  /admin/withdrawals/{id}/reject:
    post:
      operationId: rejectWithdrawal
      tags: [admin]
      summary: Reject a withdrawal request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"

  /admin/reports:
    get:
      operationId: getAdminReports
      tags: [admin]
      summary: Get all reports
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"

  /admin/reports/{id}/resolve:
    post:
      operationId: resolveReport
      tags: [admin]
      summary: Resolve a report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveReportInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /admin/admins:
    get:
      operationId: getAdmins
      tags: [admin]
      summary: Get all admin users (super admin only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
    post:
      operationId: createAdmin
      tags: [admin]
      summary: Promote a user to admin (super admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /admin/fee:
    get:
      operationId: getPlatformFee
      tags: [admin]
      summary: Get current platform fee percentage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformFee"
    patch:
      operationId: updatePlatformFee
      tags: [admin]
      summary: Update platform fee percentage (super admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformFeeUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformFee"

  # ─── WEBHOOKS ──────────────────────────────────────────────────────────────
  /webhooks/flutterwave:
    post:
      operationId: flutterwaveWebhook
      tags: [webhooks]
      summary: Flutterwave payment webhook
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: ["string", "null"]

    # ── Auth ──
    RegisterInput:
      type: object
      required: [email, username, password]
      properties:
        email:
          type: string
          format: email
        username:
          type: string
          pattern: "^[a-zA-Z0-9]+$"
          minLength: 3
        password:
          type: string
          minLength: 6

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string

    # ── User ──
    User:
      type: object
      required: [id, email, username, walletBalance, isAdmin, isSuperAdmin, isSuspended, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        username:
          type: string
        walletBalance:
          type: number
        isAdmin:
          type: boolean
        isSuperAdmin:
          type: boolean
        isSuspended:
          type: boolean
        createdAt:
          type: string
          format: date-time

    UserPublic:
      type: object
      required: [id, username, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        rating:
          type: ["number", "null"]
        totalTrades:
          type: integer
        createdAt:
          type: string
          format: date-time

    WalletBalance:
      type: object
      required: [balance]
      properties:
        balance:
          type: number

    VirtualAccount:
      type: object
      required: [id, accountNumber, bankName]
      properties:
        id:
          type: integer
        accountNumber:
          type: string
        bankName:
          type: string
        reference:
          type: ["string", "null"]

    # ── Listing ──
    Listing:
      type: object
      required: [id, sellerId, gameName, price, description, status, createdAt]
      properties:
        id:
          type: integer
        sellerId:
          type: integer
        sellerUsername:
          type: ["string", "null"]
        gameName:
          type: string
        price:
          type: number
        description:
          type: string
        pictureUrl:
          type: ["string", "null"]
        accountEmail:
          type: ["string", "null"]
        accountPassword:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, sold, deleted]
        createdAt:
          type: string
          format: date-time

    ListingInput:
      type: object
      required: [gameName, price, description]
      properties:
        gameName:
          type: string
        price:
          type: number
        description:
          type: string
        pictureUrl:
          type: string
        accountEmail:
          type: string
        accountPassword:
          type: string

    ListingUpdate:
      type: object
      properties:
        gameName:
          type: string
        price:
          type: number
        description:
          type: string
        pictureUrl:
          type: string
        status:
          type: string

    # ── Trade ──
    Trade:
      type: object
      required: [id, listingId, buyerId, sellerId, amount, status, createdAt]
      properties:
        id:
          type: integer
        listingId:
          type: integer
        buyerId:
          type: integer
        sellerId:
          type: integer
        buyerUsername:
          type: ["string", "null"]
        sellerUsername:
          type: ["string", "null"]
        gameName:
          type: ["string", "null"]
        pictureUrl:
          type: ["string", "null"]
        amount:
          type: number
        fee:
          type: ["number", "null"]
        status:
          type: string
          enum: [pending, payment_confirmed, seller_transferred, completed, disputed, refunded, cancelled]
        disputeReason:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TradeInput:
      type: object
      required: [listingId]
      properties:
        listingId:
          type: integer

    DisputeInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    # ── Trade Messages ──
    TradeMessage:
      type: object
      required: [id, tradeId, senderId, message, isSystem, createdAt]
      properties:
        id:
          type: integer
        tradeId:
          type: integer
        senderId:
          type: integer
        senderUsername:
          type: ["string", "null"]
        message:
          type: string
        isSystem:
          type: boolean
        createdAt:
          type: string
          format: date-time

    MessageInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1

    # ── Deposit ──
    Deposit:
      type: object
      required: [id, userId, amount, reference, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        amount:
          type: number
        reference:
          type: string
        status:
          type: string
          enum: [pending, completed, failed]
        createdAt:
          type: string
          format: date-time

    # ── Withdrawal ──
    Withdrawal:
      type: object
      required: [id, userId, amount, bankName, accountNumber, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        username:
          type: ["string", "null"]
        amount:
          type: number
        bankName:
          type: string
        accountNumber:
          type: string
        accountName:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected]
        rejectionReason:
          type: ["string", "null"]
        createdAt:
