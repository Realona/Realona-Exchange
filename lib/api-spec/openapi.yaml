openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Realona Exchange API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: listings
  - name: trades
  - name: chat
  - name: deposits
  - name: withdrawals
  - name: reports
  - name: admin
  - name: webhooks
  - name: offers
  - name: kyc
  - name: notifications
  - name: announcements
  - name: leaderboard
  - name: giveaways
  - name: wishlist
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── AUTH ──────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── USERS ─────────────────────────────────────────────────────────────────
  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"

  /users/wallet/balance:
    get:
      operationId: getWalletBalance
      tags: [users]
      summary: Get current user wallet balance
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletBalance"

  /users/virtual-account:
    get:
      operationId: getVirtualAccount
      tags: [users]
      summary: Get or create virtual account for deposits
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualAccount"

  # ─── LISTINGS ──────────────────────────────────────────────────────────────
  /listings:
    get:
      operationId: getListings
      tags: [listings]
      summary: Get all active listings
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: game
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: divisionRank
          in: query
          schema:
            type: string
        - name: minSquadRating
          in: query
          schema:
            type: integer
        - name: maxSquadRating
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"
    post:
      operationId: createListing
      tags: [listings]
      summary: Create a new listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"

  /listings/my:
    get:
      operationId: getMyListings
      tags: [listings]
      summary: Get current user listings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"

  /listings/{id}:
    get:
      operationId: getListing
      tags: [listings]
      summary: Get a listing by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
    patch:
      operationId: updateListing
      tags: [listings]
      summary: Update a listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
    delete:
      operationId: deleteListing
      tags: [listings]
      summary: Delete a listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ─── TRADES ────────────────────────────────────────────────────────────────
  /trades:
    get:
      operationId: getTrades
      tags: [trades]
      summary: Get current user trades (as buyer or seller)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"
    post:
      operationId: createTrade
      tags: [trades]
      summary: Initiate a trade (buy a listing)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"

  /trades/{id}:
    get:
      operationId: getTrade
      tags: [trades]
      summary: Get trade details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"

  /trades/{id}/confirm-payment:
    post:
      operationId: confirmTradePayment
      tags: [trades]
      summary: Buyer confirms payment (escrow funded)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"

  /trades/{id}/seller-transferred:
    post:
      operationId: sellerTransferred
      tags: [trades]
      summary: Seller marks account as transferred
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"

  /trades/{id}/confirm-receipt:
    post:
      operationId: confirmReceipt
      tags: [trades]
      summary: Buyer confirms receipt - releases funds to seller
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"

  /trades/{id}/dispute:
    post:
      operationId: openDispute
      tags: [trades]
      summary: Open a dispute on a trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisputeInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"

  /trades/{id}/request-otp:
    post:
      operationId: requestOtp
      tags: [trades]
      summary: Buyer requests OTP from seller
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /trades/{id}/otp-sent:
    post:
      operationId: markOtpSent
      tags: [trades]
      summary: Seller marks OTP as sent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /trades/{id}/request-email-otp:
    post:
      operationId: requestEmailOtp
      tags: [trades]
      summary: Buyer requests second OTP for email change
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  # ─── CHAT ──────────────────────────────────────────────────────────────────
  /trades/{id}/messages:
    get:
      operationId: getTradeMessages
      tags: [chat]
      summary: Get messages for a trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TradeMessage"
    post:
      operationId: sendTradeMessage
      tags: [chat]
      summary: Send a message in a trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeMessage"

  # ─── WISHLIST ──────────────────────────────────────────────────────────────
  /wishlist:
    get:
      operationId: getWishlist
      tags: [wishlist]
      summary: Get current user's wishlist
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WishlistItem"

  /wishlist/{listingId}:
    post:
      operationId: addToWishlist
      tags: [wishlist]
      summary: Add a listing to wishlist
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistItem"
    delete:
      operationId: removeFromWishlist
      tags: [wishlist]
      summary: Remove a listing from wishlist
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /purchases:
    get:
      operationId: getPurchaseHistory
      tags: [trades]
      summary: Get completed purchase history for current buyer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Purchase"

  # ─── DEPOSITS ──────────────────────────────────────────────────────────────
  /deposits:
    get:
      operationId: getDeposits
      tags: [deposits]
      summary: Get deposit history for current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deposit"

  /deposits/request:
    post:
      operationId: requestDeposit
      tags: [deposits]
      summary: Submit a deposit request (creates pending record, admin confirms)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositRequest"
      responses:
        "201":
          description: Deposit request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deposit"

  # ─── WITHDRAWALS ───────────────────────────────────────────────────────────
  /withdrawals:
    get:
      operationId: getWithdrawals
      tags: [withdrawals]
      summary: Get withdrawal history for current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Withdrawal"
    post:
      operationId: requestWithdrawal
      tags: [withdrawals]
      summary: Request a withdrawal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"

  # ─── REPORTS ───────────────────────────────────────────────────────────────
  /reports:
    post:
      operationId: createReport
      tags: [reports]
      summary: Submit a scam report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  # ─── ADMIN ─────────────────────────────────────────────────────────────────
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get platform overview stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: Get all users
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: suspended
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"

  /admin/users/{id}/suspend:
    post:
      operationId: suspendUser
      tags: [admin]
      summary: Suspend or unsuspend a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /admin/users/{id}/adjust-balance:
    post:
      operationId: adjustUserBalance
      tags: [admin]
      summary: Admin adjusts a user wallet balance (refund, penalty)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BalanceAdjustInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /admin/trades:
    get:
      operationId: getAdminTrades
      tags: [admin]
      summary: Get all trades
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"

  /admin/trades/{id}/force-complete:
    post:
      operationId: forceCompleteTrade
      tags: [admin]
      summary: Admin force completes a trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"

  /admin/trades/{id}/refund-buyer:
    post:
      operationId: refundBuyer
      tags: [admin]
      summary: Admin refunds buyer (cancel trade, return escrow)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"

  /admin/withdrawals:
    get:
      operationId: getAdminWithdrawals
      tags: [admin]
      summary: Get all withdrawal requests
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Withdrawal"

  /admin/withdrawals/{id}/approve:
    post:
      operationId: approveWithdrawal
      tags: [admin]
      summary: Approve a withdrawal request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"

  /admin/withdrawals/{id}/reject:
    post:
      operationId: rejectWithdrawal
      tags: [admin]
      summary: Reject a withdrawal request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"

  /admin/reports:
    get:
      operationId: getAdminReports
      tags: [admin]
      summary: Get all reports
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"

  /admin/reports/{id}/resolve:
    post:
      operationId: resolveReport
      tags: [admin]
      summary: Resolve a report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveReportInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /admin/admins:
    get:
      operationId: getAdmins
      tags: [admin]
      summary: Get all admin users (super admin only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
    post:
      operationId: createAdmin
      tags: [admin]
      summary: Promote a user to admin (super admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /admin/fee:
    get:
      operationId: getPlatformFee
      tags: [admin]
      summary: Get current platform fee percentage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformFee"
    patch:
      operationId: updatePlatformFee
      tags: [admin]
      summary: Update platform fee percentage (super admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformFeeUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformFee"

  # ─── WEBHOOKS ──────────────────────────────────────────────────────────────
  /webhooks/flutterwave:
    post:
      operationId: flutterwaveWebhook
      tags: [webhooks]
      summary: Flutterwave payment webhook
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ─── CANCEL TRADE ──────────────────────────────────────────────────────────
  /trades/{id}/cancel:
    post:
      operationId: cancelTrade
      tags: [trades]
      summary: Cancel a pending trade (buyer or seller)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Trade cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  # ─── TRADE CREDENTIALS ─────────────────────────────────────────────────────
  /trades/{id}/credentials:
    get:
      operationId: getTradeCredentials
      tags: [trades]
      summary: Get revealed credentials for a trade (buyer only, after payment confirmed)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradeCredentials" }

  # ─── CONFIRM ACCESS ────────────────────────────────────────────────────────
  /trades/{id}/confirm-access:
    post:
      operationId: confirmTradeAccess
      tags: [trades]
      summary: Buyer confirms they have full access to the account
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Access confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  # ─── TRADE RATINGS ─────────────────────────────────────────────────────────
  /trades/{id}/rate:
    post:
      operationId: rateTradePartner
      tags: [trades]
      summary: Submit a star rating for the trade partner after completion
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TradeRatingInput" }
      responses:
        "200":
          description: Rating submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  # ─── OFFERS ────────────────────────────────────────────────────────────────
  /listings/{id}/offers:
    post:
      operationId: makeOffer
      tags: [offers]
      summary: Make an offer on a listing
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferInput" }
      responses:
        "201":
          description: Offer created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }

  /offers:
    get:
      operationId: getMyOffers
      tags: [offers]
      summary: Get all offers for the current user (as buyer or seller)
      responses:
        "200":
          description: List of offers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Offer" }

  /offers/{id}/respond:
    post:
      operationId: respondToOffer
      tags: [offers]
      summary: Accept, reject, or counter an offer
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferResponse" }
      responses:
        "200":
          description: Offer updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  # ─── KYC ───────────────────────────────────────────────────────────────────
  /kyc/submit:
    post:
      operationId: submitKyc
      tags: [kyc]
      summary: Submit KYC documents for verification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KycInput" }
      responses:
        "201":
          description: KYC submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycSubmission" }

  /kyc/status:
    get:
      operationId: getKycStatus
      tags: [kyc]
      summary: Get current user's KYC status
      responses:
        "200":
          description: KYC status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycStatus" }

  # ─── NOTIFICATIONS ─────────────────────────────────────────────────────────
  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: Get current user's notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: All marked read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a single notification as read
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  # ─── ANNOUNCEMENTS ─────────────────────────────────────────────────────────
  /announcements:
    get:
      operationId: getAnnouncements
      tags: [announcements]
      summary: Get active announcements
      responses:
        "200":
          description: Announcements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Announcement" }

  # ─── LEADERBOARD ───────────────────────────────────────────────────────────
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get top traders leaderboard
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Leaderboard" }

  # ─── GIVEAWAYS ─────────────────────────────────────────────────────────────
  /giveaways:
    get:
      operationId: getActiveGiveaways
      tags: [giveaways]
      summary: Get active giveaways
      responses:
        "200":
          description: Active giveaways
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Giveaway" }

  # ─── ADMIN: KYC ────────────────────────────────────────────────────────────
  /admin/kyc:
    get:
      operationId: getAdminKycSubmissions
      tags: [admin]
      summary: Get all KYC submissions
      parameters:
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200":
          description: KYC submissions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/KycSubmission" }

  /admin/kyc/{id}/approve:
    post:
      operationId: approveKyc
      tags: [admin]
      summary: Approve a KYC submission
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  /admin/kyc/{id}/reject:
    post:
      operationId: rejectKyc
      tags: [admin]
      summary: Reject a KYC submission
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectInput" }
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  # ─── ADMIN: ANNOUNCEMENTS ──────────────────────────────────────────────────
  /admin/announcements:
    get:
      operationId: getAdminAnnouncements
      tags: [admin]
      summary: Get all announcements
      responses:
        "200":
          description: Announcements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Announcement" }
    post:
      operationId: createAnnouncement
      tags: [admin]
      summary: Create an announcement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Announcement" }

  /admin/announcements/{id}:
    delete:
      operationId: deleteAnnouncement
      tags: [admin]
      summary: Delete an announcement
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  # ─── ADMIN: GIVEAWAYS ──────────────────────────────────────────────────────
  /admin/giveaways:
    get:
      operationId: getAdminGiveaways
      tags: [admin]
      summary: Get all giveaways
      responses:
        "200":
          description: Giveaways
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Giveaway" }
    post:
      operationId: createGiveaway
      tags: [admin]
      summary: Create a giveaway
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GiveawayInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Giveaway" }

  /admin/giveaways/{id}:
    patch:
      operationId: updateGiveaway
      tags: [admin]
      summary: Update or toggle a giveaway
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GiveawayInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Giveaway" }

  # ─── ADMIN: DEPOSITS (confirm) ─────────────────────────────────────────────
  /admin/deposits:
    get:
      operationId: getAdminDeposits
      tags: [admin]
      summary: Get all deposits (admin)
      parameters:
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200":
          description: Deposits list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Deposit" }

  /admin/deposits/{id}/confirm:
    post:
      operationId: confirmDeposit
      tags: [admin]
      summary: Admin confirms a pending deposit and credits user wallet
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Deposit confirmed and wallet credited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  # ─── STORAGE ───────────────────────────────────────────────────────────────
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: ["string", "null"]

    # ── Auth ──
    RegisterInput:
      type: object
      required: [email, username, password]
      properties:
        email:
          type: string
          format: email
        username:
          type: string
          pattern: "^[a-zA-Z0-9]+$"
          minLength: 3
        password:
          type: string
          minLength: 6

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string

    # ── User ──
    User:
      type: object
      required: [id, email, username, walletBalance, isAdmin, isSuperAdmin, isSuspended, isVerified, kycLevel, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        username:
          type: string
        walletBalance:
          type: number
        isAdmin:
          type: boolean
        isSuperAdmin:
          type: boolean
        isSuspended:
          type: boolean
        isVerified:
          type: boolean
        kycLevel:
          type: integer
        referralCode:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    UserPublic:
      type: object
      required: [id, username, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        rating:
          type: ["number", "null"]
        totalTrades:
          type: integer
        createdAt:
          type: string
          format: date-time

    WalletBalance:
      type: object
      required: [balance]
      properties:
        balance:
          type: number

    VirtualAccount:
      type: object
      required: [id, accountNumber, bankName]
      properties:
        id:
          type: integer
        accountNumber:
          type: string
        bankName:
          type: string
        reference:
          type: ["string", "null"]

    # ── Listing ──
    Listing:
      type: object
      required: [id, sellerId, gameName, price, description, status, category, createdAt]
      properties:
        id:
          type: integer
        sellerId:
          type: integer
        sellerUsername:
          type: ["string", "null"]
        sellerIsVerified:
          type: boolean
        sellerRating:
          type: ["number", "null"]
        category:
          type: string
          enum: [efootball, social_media]
        gameName:
          type: string
        price:
          type: number
        description:
          type: string
        pictureUrl:
          type: ["string", "null"]
        accountEmail:
          type: ["string", "null"]
        accountPassword:
          type: ["string", "null"]
        divisionRank:
          type: ["string", "null"]
        squadRating:
          type: ["integer", "null"]
        # social media fields
        platform:
          type: ["string", "null"]
        accountHandle:
          type: ["string", "null"]
        followerCount:
          type: ["integer", "null"]
        following:
          type: ["integer", "null"]
        accountAge:
          type: ["string", "null"]
        engagementRate:
          type: ["string", "null"]
        viewCount:
          type: integer
        status:
          type: string
          enum: [active, sold, deleted]
        createdAt:
          type: string
          format: date-time

    ListingInput:
      type: object
      required: [gameName, price, description]
      properties:
        category:
          type: string
          enum: [efootball, social_media]
        gameName:
          type: string
        price:
          type: number
        description:
          type: string
        pictureUrl:
          type: string
        accountEmail:
          type: string
        accountPassword:
          type: string
        konamiId:
          type: string
        konamiPassword:
          type: string
        accessCode:
          type: string
        divisionRank:
          type: string
        squadRating:
          type: integer
          minimum: 2000
          maximum: 5000
        platform:
          type: string
        accountHandle:
          type: string
        followerCount:
          type: integer
        following:
          type: integer
        accountAge:
          type: string
        engagementRate:
          type: string
        highlightedPlayers:
          type: array
          items:
            type: string
          nullable: true

    ListingUpdate:
      type: object
      properties:
        gameName:
          type: string
        price:
          type: number
        description:
          type: string
        pictureUrl:
          type: string
        status:
          type: string

    # ── Trade ──
    Trade:
      type: object
      required: [id, listingId, buyerId, sellerId, amount, status, accessConfirmed, createdAt]
      properties:
        id:
          type: integer
        listingId:
          type: integer
        buyerId:
          type: integer
        sellerId:
          type: integer
        buyerUsername:
          type: ["string", "null"]
        sellerUsername:
          type: ["string", "null"]
        gameName:
          type: ["string", "null"]
        pictureUrl:
          type: ["string", "null"]
        listingCategory:
          type: ["string", "null"]
        amount:
          type: number
        agreedAmount:
          type: ["number", "null"]
        fee:
          type: ["number", "null"]
        status:
          type: string
          enum: [pending, payment_confirmed, seller_transferred, completed, disputed, refunded, cancelled]
        accessConfirmed:
          type: boolean
        disputeReason:
          type: ["string", "null"]
        buyerRating:
          type: ["number", "null"]
        sellerRating:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TradeInput:
      type: object
      required: [listingId]
      properties:
        listingId:
          type: integer

    DisputeInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    # ── Trade Messages ──
    TradeMessage:
      type: object
      required: [id, tradeId, senderId, message, isSystem, createdAt]
      properties:
        id:
          type: integer
        tradeId:
          type: integer
        senderId:
          type: integer
        senderUsername:
          type: ["string", "null"]
        message:
          type: string
        isSystem:
          type: boolean
        createdAt:
          type: string
          format: date-time

    MessageInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1

    # ── Deposit ──
    DepositRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          minimum: 1050

    Deposit:
      type: object
      required: [id, userId, amount, reference, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        username:
          type: ["string", "null"]
        amount:
          type: number
        reference:
          type: string
        status:
          type: string
          enum: [pending, completed, failed]
        createdAt:
          type: string
          format: date-time

    # ── Withdrawal ──
    Withdrawal:
      type: object
      required: [id, userId, amount, bankName, accountNumber, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        username:
          type: ["string", "null"]
        amount:
          type: number
        bankName:
          type: string
        accountNumber:
          type: string
        accountName:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected]
        rejectionReason:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    WithdrawalInput:
      type: object
      required: [amount, bankName, accountNumber, accountName]
      properties:
        amount:
          type: number
        bankName:
          type: string
        accountNumber:
          type: string
        accountName:
          type: string

    # ── Report ──
    Report:
      type: object
      required: [id, reporterId, reportedId, reason, status, createdAt]
      properties:
        id:
          type: integer
        reporterId:
          type: integer
        reporterUsername:
          type: ["string", "null"]
        reportedId:
          type: integer
        reportedUsername:
          type: ["string", "null"]
        tradeId:
          type: ["integer", "null"]
        reason:
          type: string
        evidence:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, resolved, dismissed]
        resolution:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    ReportInput:
      type: object
      required: [reportedId, reason]
      properties:
        reportedId:
          type: integer
        tradeId:
          type: ["integer", "null"]
        reason:
          type: string
        evidence:
          type: string

    # ── Admin ──
    AdminStats:
      type: object
      required: [totalUsers, totalTrades, totalDeposits, totalWithdrawals, activeTrades, pendingDisputes, escrowBalance, platformEarnings]
      properties:
        totalUsers:
          type: integer
        totalTrades:
          type: integer
        totalDeposits:
          type: number
        totalWithdrawals:
          type: number
        activeTrades:
          type: integer
        pendingDisputes:
          type: integer
        escrowBalance:
          type: number
        platformEarnings:
          type: number
        pendingWithdrawals:
          type: integer

    AdminUser:
      type: object
      required: [id, email, username, walletBalance, isAdmin, isSuperAdmin, isSuspended, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        username:
          type: string
        walletBalance:
          type: number
        isAdmin:
          type: boolean
        isSuperAdmin:
          type: boolean
        isSuspended:
          type: boolean
        totalDeposits:
          type: number
        totalWithdrawals:
          type: number
        totalTrades:
          type: integer
        createdAt:
          type: string
          format: date-time

    SuspendInput:
      type: object
      required: [suspended]
      properties:
        suspended:
          type: boolean
        reason:
          type: string

    BalanceAdjustInput:
      type: object
      required: [amount, reason]
      properties:
        amount:
          type: number
        reason:
          type: string

    AdminInput:
      type: object
      required: [userId]
      properties:
        userId:
          type: integer
        isSuperAdmin:
          type: boolean

    RejectInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    ResolveReportInput:
      type: object
      required: [resolution]
      properties:
        resolution:
          type: string
        action:
          type: string

    PlatformFee:
      type: object
      required: [feePercent]
      properties:
        feePercent:
          type: number

    PlatformFeeUpdate:
      type: object
      required: [feePercent]
      properties:
        feePercent:
          type: number

    # ── New entity schemas ──

    TradeCredentials:
      type: object
      properties:
        konamiId:
          type: ["string", "null"]
        konamiPassword:
          type: ["string", "null"]
        accessCode:
          type: ["string", "null"]
        accountEmail:
          type: ["string", "null"]
        accountPassword:
          type: ["string", "null"]

    TradeRatingInput:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string

    Offer:
      type: object
      required: [id, listingId, buyerId, sellerId, amount, status, expiresAt, createdAt]
      properties:
        id:
          type: integer
        listingId:
          type: integer
        buyerId:
          type: integer
        sellerId:
          type: integer
        buyerUsername:
          type: ["string", "null"]
        sellerUsername:
          type: ["string", "null"]
        listingTitle:
          type: ["string", "null"]
        amount:
          type: number
        counterAmount:
          type: ["number", "null"]
        message:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, accepted, rejected, countered, expired]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    OfferInput:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
        message:
          type: string

    OfferResponse:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [accept, reject, counter]
        counterAmount:
          type: number

    KycSubmission:
      type: object
      required: [id, userId, documentType, documentUrl, status, level, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        username:
          type: ["string", "null"]
        documentType:
          type: string
        documentUrl:
          type: string
        selfieUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected]
        level:
          type: integer
        adminNote:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    KycInput:
      type: object
      required: [documentType, documentUrl]
      properties:
        documentType:
          type: string
        documentUrl:
          type: string
        selfieUrl:
          type: string

    KycStatus:
      type: object
      required: [kycLevel, hasSubmission]
      properties:
        kycLevel:
          type: integer
        hasSubmission:
          type: boolean
        submission:
          $ref: "#/components/schemas/KycSubmission"

    Notification:
      type: object
      required: [id, userId, type, title, message, isRead, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        type:
          type: string
        title:
          type: string
        message:
          type: string
        isRead:
          type: boolean
        metadata:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time

    Announcement:
      type: object
      required: [id, title, description, priority, isActive, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum: [normal, important, urgent]
        isActive:
